<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="/assets/css/userProfile.css">

    <script src="../assets/js/userSidebar.js"></script>
    <script src="../assets/js/userHeader.js"></script>

    <style>
        body {
            visibility: hidden;
            margin: 0;
            overscroll-behavior: none;
        }

        #sidebar,
        #header {
            visibility: hidden;
        }
    </style>
</head>

<body class="bg-gray-100 h-full overflow-hidden">

    <div
        id="sidebar"
        class="fixed left-0 top-0 w-64 h-screen bg-white border-r border-gray-200 z-50">
    </div>

    <main class="ml-64 pt-24 h-screen overflow-hidden bg-slate-100">

        <div id="header" class="fixed top-0 left-64 right-0 h-24 bg-white border-b border-slate-200 z-40"></div>

        <div class="h-[calc(100vh-6rem)] overflow-y-auto p-6">

            <div class="max-w-6xl mx-auto space-y-5">

                <div class="bg-gradient-to-r from-blue-900 via-blue-800 to-blue-700 rounded-3xl shadow-lg overflow-hidden">

                    <div class="p-7 flex flex-col lg:flex-row justify-between items-center gap-6">

                        <div class="flex items-center gap-5">

                            <div id="avatarContainer" class="avatar-container w-28 h-28 rounded-full bg-white/10 backdrop-blur border-4 border-white/30 overflow-hidden flex-shrink-0 shadow-lg">
                                <div id="avatarDisplay" class="avatar-placeholder">
                                    <i class="fas fa-user text-white text-4xl"></i>
                                </div>

                                <div id="avatarOverlay" class="avatar-overlay">
                                    <i class="fas fa-camera"></i>
                                </div>

                                <input id="avatarInput" type="file" accept="image/*" class="hidden">
                            </div>

                            <div>
                                <h1 id="display-name" class="text-3xl font-bold text-white">Jhyzeel Dianela</h1>

                                <div class="inline-flex items-center gap-2 mt-3 px-3 py-1 rounded-full bg-white/20 text-white text-sm">
                                    <i class="fas fa-user text-xs"></i>
                                    <span id="display-account-type">User</span>
                                </div>

                                <div class="flex items-center gap-2 mt-4 text-blue-100 text-sm">
                                    <i class="fas fa-calendar-alt"></i>
                                    <span>Member since February 20, 2026</span>
                                </div>
                            </div>

                        </div>

                        <div id="action-buttons">
                            <button id="edit-btn" class="px-5 py-2.5 rounded-xl bg-white text-blue-800 font-semibold shadow hover:scale-[1.02] transition">
                                <i class="fas fa-edit mr-2"></i>Edit Profile
                            </button>

                            <div id="edit-actions" class="hidden flex gap-3">
                                <button id="save-btn" class="px-5 py-2.5 rounded-xl bg-emerald-500 text-white font-semibold hover:bg-emerald-600 transition">
                                    <i class="fas fa-save mr-2"></i>Save
                                </button>

                                <button id="cancel-btn" class="px-5 py-2.5 rounded-xl bg-red-500 text-white font-semibold hover:bg-red-600 transition">
                                    <i class="fas fa-times mr-2"></i>Cancel
                                </button>
                            </div>
                        </div>

                    </div>

                </div>

                <div class="grid grid-cols-12 gap-5">

                    <div class="col-span-12 lg:col-span-8 bg-white rounded-3xl border border-slate-200 shadow-sm">

                        <div class="px-6 py-4 border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center">
                                    <i class="fas fa-user"></i>
                                </div>

                                <h2 class="font-bold text-lg text-slate-800">Personal Information</h2>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-5">

                            <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Full Name</label>
                                <div id="full-name-display" class="mt-2 text-slate-800 font-semibold">Jhyzeel Dianela</div>
                                <input id="full-name-input" type="text" class="hidden w-full mt-2 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Email</label>
                                <div id="email-display" class="mt-2 text-slate-800 font-semibold">jhdianela@gmail.com</div>
                                <input id="email-input" type="email" class="hidden w-full mt-2 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Mobile Number</label>
                                <div id="mobile-display" class="mt-2 text-slate-800 font-semibold">09924974712</div>
                                <input id="mobile-input" type="text" class="hidden w-full mt-2 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Account Type</label>
                                <div class="mt-2 text-slate-800 font-semibold">User</div>
                            </div>

                        </div>

                    </div>

                    <div class="col-span-12 lg:col-span-4 bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col">

                        <div class="px-6 py-4 border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center">
                                    <i class="fas fa-shield-alt"></i>
                                </div>

                                <div>
                                    <h3 class="font-bold text-slate-800">Account Security</h3>
                                    <p class="text-xs text-slate-500">Protect your account</p>
                                </div>
                            </div>
                        </div>

                        <div class="p-5 flex flex-col gap-5">
                            <button id="toggle-password-btn" class="w-full bg-blue-700 hover:bg-blue-800 text-white rounded-xl py-3 font-semibold transition">
                                <i class="fas fa-lock mr-2"></i>Change Password
                            </button>

                            <div id="password-form" class="hidden space-y-3">
                                <input id="current-password" type="password" placeholder="Current Password" class="w-full rounded-xl border border-slate-300 px-4 py-3">
                                <input id="new-password" type="password" placeholder="New Password" class="w-full rounded-xl border border-slate-300 px-4 py-3">
                                <input id="confirm-password" type="password" placeholder="Confirm New Password" class="w-full rounded-xl border border-slate-300 px-4 py-3">

                                <button id="update-password-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl py-3 font-semibold transition">Update Password</button>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script>
        let isEditing = false;
        let isPasswordFormVisible = false;

        const displayName = document.getElementById('display-name');
        const displayAccountType = document.getElementById('display-account-type');
        const memberSinceText = document.querySelector('.fa-calendar-alt').nextElementSibling;

        const fullNameDisplay = document.getElementById('full-name-display');
        const fullNameInput = document.getElementById('full-name-input');
        const emailDisplay = document.getElementById('email-display');
        const emailInput = document.getElementById('email-input');
        const mobileDisplay = document.getElementById('mobile-display');
        const mobileInput = document.getElementById('mobile-input');

        const editBtn = document.getElementById('edit-btn');
        const editActions = document.getElementById('edit-actions');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');

        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const passwordForm = document.getElementById('password-form');
        const currentPassword = document.getElementById('current-password');
        const newPassword = document.getElementById('new-password');
        const confirmPassword = document.getElementById('confirm-password');
        const updatePasswordBtn = document.getElementById('update-password-btn');

        const avatarContainer = document.getElementById('avatarContainer');
        const avatarOverlay = document.getElementById('avatarOverlay');
        const avatarInput = document.getElementById('avatarInput');
        const avatarDisplay = document.getElementById('avatarDisplay');

        function setAvatarEditMode(editable) {
            const container = document.getElementById('avatarContainer');
            if(container) {
                if(editable) container.classList.add('editable');
                else container.classList.remove('editable');
            }
        }

        async function fetchProfileData() {
            try {
                const response = await fetch('/api/user/profile');
                if (!response.ok) throw new Error("Failed to fetch profile");
                
                const data = await response.json();
                
                const fName = data.first_name || '';
                const lName = data.last_name || '';
                const fullCombinedName = `${fName} ${lName}`.trim() || 'No Name Set';

                displayName.textContent = fullCombinedName;
                displayAccountType.textContent = data.role ? data.role.toUpperCase() : 'USER';
                
                fullNameDisplay.textContent = fullCombinedName;
                fullNameInput.value = fullCombinedName;

                emailDisplay.textContent = data.email || '';
                emailInput.value = data.email || '';

                mobileDisplay.textContent = data.phone_number || 'N/A';
                mobileInput.value = data.phone_number || '';

                if (data.profile_picture) {
                    avatarDisplay.innerHTML = `<img src="${data.profile_picture}" alt="Profile Picture" class="w-full h-full object-cover rounded-full">`;
                } else {
                    avatarDisplay.innerHTML = `<i class="fas fa-user"></i>`;
                }

                if (data.created_at) {
                    const date = new Date(data.created_at);
                    memberSinceText.textContent = `Member since ${date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
                }

            } catch (error) {
                console.error("Error loading profile:", error);
            }
        }

        function enterEditMode() {
            isEditing = true;
            editBtn.classList.add('hidden');
            editActions.classList.remove('hidden');

            fullNameDisplay.classList.add('hidden');
            fullNameInput.classList.remove('hidden');
            emailDisplay.classList.add('hidden');
            emailInput.classList.remove('hidden');
            mobileDisplay.classList.add('hidden');
            mobileInput.classList.remove('hidden');
            
            if (avatarOverlay) {
                avatarOverlay.classList.remove('hidden');
                avatarOverlay.style.opacity = "1"; 
            }
            setAvatarEditMode(true);
        }

        function exitEditMode() {
            isEditing = false;
            editBtn.classList.remove('hidden');
            editActions.classList.add('hidden');

            fullNameDisplay.classList.remove('hidden');
            fullNameInput.classList.add('hidden');
            emailDisplay.classList.remove('hidden');
            emailInput.classList.add('hidden');
            mobileDisplay.classList.remove('hidden');
            mobileInput.classList.add('hidden');
            
            if (avatarOverlay) {
                avatarOverlay.classList.add('hidden');
                avatarOverlay.style.opacity = "0";
            }
            setAvatarEditMode(false);
        }

        async function saveProfile() {
            const updatedData = {
                fullName: fullNameInput.value.trim(),
                email: emailInput.value.trim(),
                mobile: mobileInput.value.trim()
            };

            if (!updatedData.fullName || !updatedData.email) {
                alert('Full name and Email cannot be left empty.');
                return;
            }

            try {
                const response = await fetch('/api/user/profile/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('Profile Updated Successfully in Database!');
                    fetchProfileData();
                    exitEditMode();
                    
                    if(typeof loadComponent === "function") {
                       loadComponent("header", "/user/userHeader.html");
                    }
                } else {
                    alert('Failed to update profile: ' + result.error);
                }
            } catch (error) {
                console.error("Network update error:", error);
                alert('A network error occurred while updating profile.');
            }
        }

        function cancelEdit() {
            fetchProfileData(); 
            exitEditMode();
        }

        function togglePasswordForm() {
            isPasswordFormVisible = !isPasswordFormVisible;
            if (isPasswordFormVisible) {
                passwordForm.classList.remove('hidden');
                togglePasswordBtn.innerHTML = '<i class="fas fa-times"></i> Cancel Change';
                togglePasswordBtn.className = "flex items-center gap-2 border border-red-500 text-red-500 px-4 py-2 rounded-lg hover:bg-red-50 transition-custom";
            } else {
                passwordForm.classList.add('hidden');
                togglePasswordBtn.innerHTML = '<i class="fas fa-lock"></i> Change Password';
                togglePasswordBtn.className = "flex items-center gap-2 border border-blue-500 text-blue-500 px-4 py-2 rounded-lg hover:bg-blue-50 transition-custom";
                
                currentPassword.value = '';
                newPassword.value = '';
                confirmPassword.value = '';
            }
        }

        async function updatePassword() {
            const currentPwd = currentPassword.value.trim();
            const newPwd = newPassword.value.trim();
            const confirm = confirmPassword.value.trim();

            if (!currentPwd || !newPwd || !confirm) {
                alert('Please fill in all password fields.');
                return;
            }

            if (newPwd !== confirm) {
                alert('New passwords do not match!');
                return;
            }

            if (newPwd.length < 6) {
                alert('New password must be at least 6 characters long.');
                return;
            }

            try {
                const response = await fetch('/api/user/profile/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        currentPassword: currentPwd,
                        newPassword: newPwd
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('Password Changed Successfully in Database!');
                    togglePasswordForm(); 
                } else {
                    alert('Failed to change password: ' + result.error);
                }
            } catch (error) {
                console.error("Network update error for password:", error);
                alert('A network error occurred while updating the password.');
            }
        }

        avatarOverlay.addEventListener('click', () => {
            if (isEditing) {
                avatarInput.click();
            } else {
                alert('Please click "Edit Profile" first before changing your profile picture.');
            }
        });

        avatarInput.addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Please select an image file.');
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                alert('File size is too large. Maximum limit is 2MB.');
                return;
            }

            const formData = new FormData();
            formData.append('avatar', file); 

            try {
                const response = await fetch('/api/user/profile/avatar', {
                    method: 'POST',
                    body: formData 
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `Server responded with status ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    alert('Profile picture uploaded successfully!');
                    avatarDisplay.innerHTML = `<img src="${result.avatarUrl}" alt="Profile Picture" class="w-full h-full object-cover rounded-full">`;
                    
                    if (typeof loadComponent === "function") {
                        loadComponent("header", "/user/userHeader.html");
                    }
                } else {
                    alert('Failed to upload: ' + result.error);
                }
            } catch (error) {
                console.error("Avatar upload error detailed:", error);
                alert('A network error occurred: ' + error.message);
            }
        });

        editBtn.addEventListener('click', enterEditMode);
        saveBtn.addEventListener('click', saveProfile);
        cancelBtn.addEventListener('click', cancelEdit);
        
        togglePasswordBtn.addEventListener('click', togglePasswordForm);
        updatePasswordBtn.addEventListener('click', updatePassword);

        document.querySelectorAll('#password-form input').forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    updatePassword();
                }
            });
        });

        // Initialization gamit ang loadSidebar, loadTopbar, at fetchProfileData katulad ng Adoption Hub
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                await loadSidebar();

                requestAnimationFrame(async () => {
                    if (typeof loadTopbar === "function") {
                        await loadTopbar({
                            title: "User Profile",
                            subtitle: "Manage your personal account details, preferences, and security settings."
                        });
                    }

                    await fetchProfileData();
                    setAvatarEditMode(false);

                    document.body.style.visibility = "visible";
                });

            } catch (error) {
                console.error("Error initializing page:", error);
                document.body.style.visibility = "visible";
            }
        });
    </script>
</body>
</html>
