<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="/assets/css/userProfile.css">

    <script src="../assets/js/userSidebar.js"></script>
    <script src="../assets/js/userHeader.js"></script>

    <style>
        body {
            visibility: hidden;
            margin: 0;
            overscroll-behavior: none;
        }

        #sidebar,
        #header {
            visibility: hidden;
        }
    </style>
</head>

<body class="bg-gray-100 h-full overflow-hidden">

    <div
        id="sidebar"
        class="fixed left-0 top-0 w-64 h-screen bg-white border-r border-gray-200 z-50">
    </div>

    <main class="ml-64 pt-24 h-screen overflow-hidden bg-slate-100">

        <div id="header" class="fixed top-0 left-64 right-0 h-24 bg-white border-b border-slate-200 z-40"></div>

        <div class="h-[calc(100vh-6rem)] overflow-y-auto p-6">

            <div class="max-w-6xl mx-auto space-y-5">

                <div class="bg-gradient-to-r from-blue-900 via-blue-800 to-blue-700 rounded-3xl shadow-lg overflow-hidden">

                    <div class="p-7 flex flex-col lg:flex-row justify-between items-center gap-6">

                        <div class="flex items-center gap-5">

                            <div id="avatarContainer" class="avatar-container w-28 h-28 rounded-full bg-white/10 backdrop-blur border-4 border-white/30 overflow-hidden flex-shrink-0 shadow-lg">
                                <div id="avatarDisplay" class="avatar-placeholder">
                                    <i class="fas fa-user text-white text-4xl"></i>
                                </div>

                                <div id="avatarOverlay" class="avatar-overlay">
                                    <i class="fas fa-camera"></i>
                                </div>

                                <input id="avatarInput" type="file" accept="image/*" class="hidden">
                            </div>

                            <div>
                                <h1 id="display-name" class="text-3xl font-bold text-white">---</h1>
                           
                                <div class="inline-flex items-center gap-2 mt-3 px-3 py-1 rounded-full bg-white/20 text-white text-sm">
                                    <i class="fas fa-user text-xs"></i>
                                    <span id="display-account-type">Loading...</span>
                                </div>
                            
                                <div class="flex items-center gap-2 mt-4 text-blue-100 text-sm">
                                    <i class="fas fa-calendar-alt"></i>
                                    <span id="display-member-since">Loading member date...</span>
                                </div>
                            </div>

                        </div>

                        <div id="action-buttons">
                            <button id="edit-btn" class="px-5 py-2.5 rounded-xl bg-white text-blue-800 font-semibold shadow hover:scale-[1.02] transition">
                                <i class="fas fa-edit mr-2"></i>Edit Profile
                            </button>

                            <div id="edit-actions" class="hidden flex gap-3">
                                <button id="save-btn" class="px-5 py-2.5 rounded-xl bg-emerald-500 text-white font-semibold hover:bg-emerald-600 transition">
                                    <i class="fas fa-save mr-2"></i>Save
                                </button>

                                <button id="cancel-btn" class="px-5 py-2.5 rounded-xl bg-red-500 text-white font-semibold hover:bg-red-600 transition">
                                    <i class="fas fa-times mr-2"></i>Cancel
                                </button>
                            </div>
                        </div>

                    </div>

                </div>

                <div class="grid grid-cols-12 gap-5">

                    <!-- PERSONAL INFORMATION CARD -->
                    <div class="col-span-12 lg:col-span-8 bg-white rounded-3xl border border-slate-200 shadow-sm">
                        <div class="px-6 py-4 border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center">
                                    <i class="fas fa-user"></i>
                                </div>
                                <h2 class="font-bold text-lg text-slate-800">Personal Information</h2>
                            </div>
                        </div>

                        <!-- VIEW MODE (Removed Full Name, Email, Mobile Number, Account Type) -->
                        <div id="view-mode-section" class="grid grid-cols-1 md:grid-cols-2 gap-4 p-5">
                            
                            <!-- Birthday -->
                            <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Birthday</label>
                                <div id="view-birthday" class="mt-2 text-slate-800 font-semibold">-</div>
                            </div>

                            <!-- Civil Status (Conditional: Auto-hides if empty or N/A) -->
                            <div id="container-view-civil-status" class="rounded-2xl bg-slate-50 border border-slate-200 p-4 hidden">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Civil Status</label>
                                <div id="view-civil-status" class="mt-2 text-slate-800 font-semibold">-</div>
                            </div>

                            <!-- Occupation (Conditional: Auto-hides if empty or N/A) -->
                            <div id="container-view-occupation" class="rounded-2xl bg-slate-50 border border-slate-200 p-4 hidden">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Occupation</label>
                                <div id="view-occupation" class="mt-2 text-slate-800 font-semibold">-</div>
                            </div>

                            <!-- Region -->
                            <div id="container-view-region" class="rounded-2xl bg-slate-50 border border-slate-200 p-4">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Region</label>
                                <div id="view-region" class="mt-2 text-slate-800 font-semibold">-</div>
                            </div>

                            <!-- Full Address -->
                            <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4 md:col-span-2">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Full Address</label>
                                <div id="view-full-address" class="mt-2 text-slate-800 font-semibold">-</div>
                            </div>

                        </div>

                        <!-- EDIT MODE -->
                        <div id="edit-mode-section" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 p-5">
                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">First Name</label>
                                <input id="input-first-name" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Last Name</label>
                                <input id="input-last-name" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Email</label>
                                <input id="input-email" type="email" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Mobile Number</label>
                                <input id="input-mobile" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Birthday</label>
                                <input id="input-birthday" type="date" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Civil Status</label>
                                <select id="input-civil-status" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300 bg-white">
                                    <option value="">Select Civil Status</option>
                                    <option value="Single">Single</option>
                                    <option value="Married">Married</option>
                                    <option value="Widowed">Widowed</option>
                                    <option value="Separated">Separated</option>
                                </select>
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Occupation</label>
                                <input id="input-occupation" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Street Address</label>
                                <input id="input-street" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Barangay</label>
                                <input id="input-barangay" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">City / Municipality</label>
                                <input id="input-city" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Province</label>
                                <input id="input-province" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div>
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Region</label>
                                <input id="input-region" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>

                            <div class="md:col-span-2">
                                <label class="text-xs uppercase tracking-wider text-slate-500 font-semibold">ZIP Code</label>
                                <input id="input-zip" type="text" class="w-full mt-1 border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-300">
                            </div>
                        </div>
                    </div>

                    <div class="col-span-12 lg:col-span-4 bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col">

                        <div class="px-6 py-4 border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center">
                                    <i class="fas fa-shield-alt"></i>
                                </div>

                                <div>
                                    <h3 class="font-bold text-slate-800">Account Security</h3>
                                    <p class="text-xs text-slate-500">Protect your account</p>
                                </div>
                            </div>
                        </div>

                        <div class="p-5 flex flex-col gap-5">
                            <button id="toggle-password-btn" class="w-full bg-blue-700 hover:bg-blue-800 text-white rounded-xl py-3 font-semibold transition">
                                <i class="fas fa-lock mr-2"></i>Change Password
                            </button>

                            <div id="password-form" class="hidden space-y-3">
                                <input id="current-password" type="password" placeholder="Current Password" class="w-full rounded-xl border border-slate-300 px-4 py-3">
                                <input id="new-password" type="password" placeholder="New Password" class="w-full rounded-xl border border-slate-300 px-4 py-3">
                                <input id="confirm-password" type="password" placeholder="Confirm New Password" class="w-full rounded-xl border border-slate-300 px-4 py-3">

                                <button id="update-password-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl py-3 font-semibold transition">Update Password</button>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script>
        let isEditing = false;
        let isPasswordFormVisible = false;

        const displayName = document.getElementById('display-name');
        const memberSinceText = document.querySelector('.fa-calendar-alt').nextElementSibling;

        const viewModeSection = document.getElementById('view-mode-section');
        const editModeSection = document.getElementById('edit-mode-section');

        const viewFullName = document.getElementById('view-full-name');
        const viewEmail = document.getElementById('view-email');
        const viewMobile = document.getElementById('view-mobile');
        const viewBirthday = document.getElementById('view-birthday');
        const containerViewCivilStatus = document.getElementById('container-view-civil-status');
        const viewCivilStatus = document.getElementById('view-civil-status');
        const containerViewOccupation = document.getElementById('container-view-occupation');
        const viewOccupation = document.getElementById('view-occupation');
        const viewFullAddress = document.getElementById('view-full-address');
        const viewRegion = document.getElementById('view-region');

        // Input Elements
        const inputFirstName = document.getElementById('input-first-name');
        const inputLastName = document.getElementById('input-last-name');
        const inputEmail = document.getElementById('input-email');
        const inputMobile = document.getElementById('input-mobile');
        const inputBirthday = document.getElementById('input-birthday');
        const inputCivilStatus = document.getElementById('input-civil-status');
        const inputOccupation = document.getElementById('input-occupation');
        const inputStreet = document.getElementById('input-street');
        const inputBarangay = document.getElementById('input-barangay');
        const inputCity = document.getElementById('input-city');
        const inputProvince = document.getElementById('input-province');
        const inputRegion = document.getElementById('input-region');
        const inputZip = document.getElementById('input-zip');

        const editBtn = document.getElementById('edit-btn');
        const editActions = document.getElementById('edit-actions');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');

        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const passwordForm = document.getElementById('password-form');
        const currentPassword = document.getElementById('current-password');
        const newPassword = document.getElementById('new-password');
        const confirmPassword = document.getElementById('confirm-password');
        const updatePasswordBtn = document.getElementById('update-password-btn');

        const avatarContainer = document.getElementById('avatarContainer');
        const avatarOverlay = document.getElementById('avatarOverlay');
        const avatarInput = document.getElementById('avatarInput');
        const avatarDisplay = document.getElementById('avatarDisplay');

        function setAvatarEditMode(editable) {
            const container = document.getElementById('avatarContainer');
            if(container) {
                if(editable) container.classList.add('editable');
                else container.classList.remove('editable');
            }
        }

        async function fetchProfileData() {
            try {
                const response = await fetch('/api/user/profile');
                if (!response.ok) throw new Error("Failed to fetch profile");
                
                const data = await response.json();
                
                const fName = data.first_name || '';
                const lName = data.last_name || '';
                const fullCombinedName = `${fName} ${lName}`.trim() || 'No Name Set';

                if (displayName) displayName.textContent = fullCombinedName;
                
                // I-display ang Role mula sa Database (e.g. 'adopter' -> 'ADOPTER', 'user' -> 'USER')
                const displayAccountType = document.getElementById('display-account-type');
                if (displayAccountType) {
                    displayAccountType.textContent = data.role 
                        ? (data.role.charAt(0).toUpperCase() + data.role.slice(1).toLowerCase()) // Halimbawa: "User" o "Adopter"
                        : 'User';
                }

                // 3. Member since date
                if (data.created_at && memberSinceText) {
                    const date = new Date(data.created_at);
                    memberSinceText.textContent = `Member since ${date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
                }
                
                // Format Birthday
                if (data.birthday) {
                    const rawDate = data.birthday.toString().split('T')[0];
                    
                    // View Mode: August 16, 2005
                    viewBirthday.textContent = formatBirthdayView(data.birthday);
                    
                    // Edit Mode: 2005-08-16
                    inputBirthday.value = rawDate;
                } else {
                    viewBirthday.textContent = 'N/A';
                    inputBirthday.value = '';
                }

                // Civil Status check
                if (data.civil_status && data.civil_status.trim() !== '' && data.civil_status.toUpperCase() !== 'N/A') {
                    containerViewCivilStatus.classList.remove('hidden');
                    viewCivilStatus.textContent = data.civil_status;
                } else {
                    containerViewCivilStatus.classList.add('hidden');
                }

                // Occupation check
                if (data.occupation && data.occupation.trim() !== '' && data.occupation.toUpperCase() !== 'N/A') {
                    containerViewOccupation.classList.remove('hidden');
                    viewOccupation.textContent = data.occupation;
                } else {
                    containerViewOccupation.classList.add('hidden');
                }

                // Construct Full Address
                const addressParts = [
                    data.street_address,
                    data.barangay ? `Brgy. ${data.barangay}` : '',
                    data.city,
                    data.province,
                    data.zip_code
                ].filter(part => part && part.trim() !== '');

                viewFullAddress.textContent = addressParts.length > 0 ? addressParts.join(', ') : 'N/A';
                viewRegion.textContent = data.region || 'N/A';

                // Edit Mode Form Inputs Populating
                inputFirstName.value = fName;
                inputLastName.value = lName;
                inputEmail.value = data.email || '';
                inputMobile.value = data.phone_number || '';
                inputCivilStatus.value = data.civil_status || '';
                inputOccupation.value = data.occupation || '';
                inputStreet.value = data.street_address || '';
                inputBarangay.value = data.barangay || '';
                inputCity.value = data.city || '';
                inputProvince.value = data.province || '';
                inputRegion.value = data.region || '';
                inputZip.value = data.zip_code || '';

                if (data.profile_picture) {
                    avatarDisplay.innerHTML = `<img src="${data.profile_picture}" alt="Profile Picture" class="w-full h-full object-cover rounded-full">`;
                } else {
                    avatarDisplay.innerHTML = `<i class="fas fa-user"></i>`;
                }


            } catch (error) {
                console.error("Error loading profile:", error);
            }
        }

        function enterEditMode() {
            isEditing = true;
            editBtn.classList.add('hidden');
            editActions.classList.remove('hidden');

            viewModeSection.classList.add('hidden');
            editModeSection.classList.remove('hidden');
            
            if (avatarOverlay) {
                avatarOverlay.classList.remove('hidden');
                avatarOverlay.style.opacity = "1"; 
            }
            setAvatarEditMode(true);
        }

        function exitEditMode() {
            isEditing = false;
            editBtn.classList.remove('hidden');
            editActions.classList.add('hidden');

            viewModeSection.classList.remove('hidden');
            editModeSection.classList.add('hidden');
            
            if (avatarOverlay) {
                avatarOverlay.classList.add('hidden');
                avatarOverlay.style.opacity = "0";
            }
            setAvatarEditMode(false);
        }

        async function saveProfile() {
            const payload = {
                firstName: inputFirstName.value.trim(),
                lastName: inputLastName.value.trim(),
                email: inputEmail.value.trim(),
                mobile: inputMobile.value.trim(),
                birthday: inputBirthday.value,
                civilStatus: inputCivilStatus.value,
                occupation: inputOccupation.value.trim(),
                streetAddress: inputStreet.value.trim(),
                barangay: inputBarangay.value.trim(),
                city: inputCity.value.trim(),
                province: inputProvince.value.trim(),
                region: inputRegion.value.trim(),
                zipCode: inputZip.value.trim()
            };

            if (!payload.firstName || !payload.lastName || !payload.email) {
                alert('First Name, Last Name, and Email are required.');
                return;
            }

            try {
                const response = await fetch('/api/user/profile/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    alert('Profile Updated Successfully!');
                    await fetchProfileData();
                    exitEditMode();
                    
                    if(typeof loadComponent === "function") {
                       loadComponent("header", "/user/userHeader.html");
                    }
                } else {
                    alert('Failed to update profile: ' + result.error);
                }
            } catch (error) {
                console.error("Network update error:", error);
                alert('A network error occurred while updating profile.');
            }
        }

        function cancelEdit() {
            fetchProfileData(); 
            exitEditMode();
        }

        function formatBirthdayView(dateStr) {
            if (!dateStr) return 'N/A';
            
            // Kunin ang YYYY-MM-DD para iwas timezone bug
            const cleanDate = dateStr.toString().split('T')[0];
            const [year, month, day] = cleanDate.split('-');
            
            if (!year || !month || !day) return 'N/A';

            const fullMonthNames = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];

            const monthIndex = parseInt(month, 10) - 1;
            const formattedDay = day.padStart(2, '0');
            const formattedMonth = fullMonthNames[monthIndex] || '';

            return `${formattedMonth} ${formattedDay}, ${year}`;
        }

        function togglePasswordForm() {
            isPasswordFormVisible = !isPasswordFormVisible;
            if (isPasswordFormVisible) {
                passwordForm.classList.remove('hidden');
                togglePasswordBtn.innerHTML = '<i class="fas fa-times"></i> Cancel Change';
                togglePasswordBtn.className = "flex items-center gap-2 border border-red-500 text-red-500 px-4 py-2 rounded-lg hover:bg-red-50 transition-custom";
            } else {
                passwordForm.classList.add('hidden');
                togglePasswordBtn.innerHTML = '<i class="fas fa-lock"></i> Change Password';
                togglePasswordBtn.className = "flex items-center gap-2 border border-blue-500 text-blue-500 px-4 py-2 rounded-lg hover:bg-blue-50 transition-custom";
                
                currentPassword.value = '';
                newPassword.value = '';
                confirmPassword.value = '';
            }
        }

        async function updatePassword() {
            const currentPwd = currentPassword.value.trim();
            const newPwd = newPassword.value.trim();
            const confirm = confirmPassword.value.trim();

            if (!currentPwd || !newPwd || !confirm) {
                alert('Please fill in all password fields.');
                return;
            }

            if (newPwd !== confirm) {
                alert('New passwords do not match!');
                return;
            }

            if (newPwd.length < 6) {
                alert('New password must be at least 6 characters long.');
                return;
            }

            try {
                const response = await fetch('/api/user/profile/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        currentPassword: currentPwd,
                        newPassword: newPwd
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('Password Changed Successfully in Database!');
                    togglePasswordForm(); 
                } else {
                    alert('Failed to change password: ' + result.error);
                }
            } catch (error) {
                console.error("Network update error for password:", error);
                alert('A network error occurred while updating the password.');
            }
        }

        avatarOverlay.addEventListener('click', () => {
            if (isEditing) {
                avatarInput.click();
            } else {
                alert('Please click "Edit Profile" first before changing your profile picture.');
            }
        });

        avatarInput.addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Please select an image file.');
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                alert('File size is too large. Maximum limit is 2MB.');
                return;
            }

            const formData = new FormData();
            formData.append('avatar', file); 

            try {
                const response = await fetch('/api/user/profile/avatar', {
                    method: 'POST',
                    body: formData 
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `Server responded with status ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    alert('Profile picture uploaded successfully!');
                    avatarDisplay.innerHTML = `<img src="${result.avatarUrl}" alt="Profile Picture" class="w-full h-full object-cover rounded-full">`;
                    
                    if (typeof loadComponent === "function") {
                        loadComponent("header", "/user/userHeader.html");
                    }
                } else {
                    alert('Failed to upload: ' + result.error);
                }
            } catch (error) {
                console.error("Avatar upload error detailed:", error);
                alert('A network error occurred: ' + error.message);
            }
        });

        editBtn.addEventListener('click', enterEditMode);
        saveBtn.addEventListener('click', saveProfile);
        cancelBtn.addEventListener('click', cancelEdit);
        
        togglePasswordBtn.addEventListener('click', togglePasswordForm);
        updatePasswordBtn.addEventListener('click', updatePassword);

        document.querySelectorAll('#password-form input').forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    updatePassword();
                }
            });
        });

        // Initialization gamit ang loadSidebar, loadTopbar, at fetchProfileData katulad ng Adoption Hub
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                await loadSidebar();

                requestAnimationFrame(async () => {
                    if (typeof loadTopbar === "function") {
                        await loadTopbar({
                            title: "User Profile",
                            subtitle: "Manage your personal account details, preferences, and security settings."
                        });
                    }

                    await fetchProfileData();
                    setAvatarEditMode(false);

                    document.body.style.visibility = "visible";
                });

            } catch (error) {
                console.error("Error initializing page:", error);
                document.body.style.visibility = "visible";
            }
        });
    </script>
</body>
</html>
