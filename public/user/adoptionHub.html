<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adoption Hub</title>

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="../assets/js/userSidebar.js"></script>
    <script src="../assets/js/userAdoptionHub.js" defer></script>

    <style>
        body {
            visibility: hidden;
        }

        #sidebar,
        #header {
            visibility: hidden;
        }

        .upload-box-hover:hover {
            border-color: #94a3b8;
        }

        .btn-back-hover:hover {
            transform: translateX(-3px);
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* INALIS ANG UP AT DOWN ARROW SA NUMBER INPUTS */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body class="bg-gray-100 h-full overflow-hidden">

    <!-- ===== SIDEBAR ===== -->
    <div id="sidebar" class="fixed left-0 top-0 w-64 h-screen bg-white border-r border-gray-200 z-50"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="ml-64 pt-24 h-screen overflow-hidden bg-gray-50">

        <!-- ===== HEADER ===== -->
        <div id="header" class="fixed top-0 left-64 right-0 h-24 bg-white border-b border-gray-200 z-40"></div>

        <!-- ===== ADOPTION HUB CONTAINER ===== -->
        <div class="h-[calc(100vh-6rem)] overflow-y-auto p-6 lg:p-8">
            <div class="max-w-7xl mx-auto">

                <!-- ===== LIST VIEW ===== -->
                <div id="list-view">
                    <!-- SEARCH & FILTER -->
                    <div class="bg-white rounded-2xl shadow-sm p-3 mb-6 -mt-4 flex flex-col md:flex-row gap-4">
                        <input type="text" id="search-input" placeholder="Search pet name or breed..." class="flex-1 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-400" />
                        <select id="type-filter" class="border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="All">All Types</option>
                            <option value="Dog">Dog</option>
                            <option value="Cat">Cat</option>
                        </select>
                    </div>

                    <!-- PET GRID -->
                    <div id="pet-grid" class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-5"></div>
                </div>

                <!-- ===== SINGLE-PAGE APPLICATION FORM VIEW ===== -->
                <div id="application-view" class="hidden">

                    <!-- Form Header Controls -->
                    <div class="mb-6 flex items-center justify-between">
                        <button id="appBackBtn" type="button" class="flex items-center gap-2 text-gray-600 hover:text-blue-600 font-medium transition-colors">
                            <i class="fa-solid fa-arrow-left"></i> Back to Pet Details
                        </button>
                    </div>

                    <form id="adoptionForm" class="space-y-6">
                        <!-- Hidden input for Pet ID -->
                        <input type="hidden" id="selectedPetId" name="animal_id" value="" />
                    
                        <!-- Section 1: Applicant Info -->
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <h3 class="text-blue-600 font-bold flex items-center gap-2 mb-4">
                                <i class="fa-regular fa-user"></i> Applicant Information
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
                                    <input type="text" id="app-fullname" name="full_name" placeholder="Type Full Name" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Contact Number <span class="text-red-500">*</span></label>
                                    <input type="tel" id="app-phone" name="contact_number" placeholder="09123456789" maxlength="11" pattern="09[0-9]{9}" title="Must be a valid PH phone number starting with 09 (11 digits)" class="ph-phone-input w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Email Address <span class="text-red-500">*</span></label>
                                    <input type="email" id="app-email" name="email" placeholder="email" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required />
                                </div>
                    
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Full Address <span class="text-red-500">*</span></label>
                                    <input type="text" id="app-address" name="full_address" placeholder="House No., Street, City" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Civil Status <span class="text-red-500">*</span></label>
                                    <select id="app-civil" name="civil_status" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required>
                                        <option value="">Choose Civil Status</option>
                                        <option value="Single">Single</option>
                                        <option value="Married">Married</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Age <span class="text-red-500">*</span></label>
                                    <input type="number" id="app-age" name="age" min="18" max="99" maxlength="2" placeholder="Type Age (e.g. 25)" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required />
                                </div>
                    
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Occupation / Source of Income <span class="text-red-500">*</span></label>
                                    <input type="text" id="app-occupation" name="occupation" placeholder="e.g. Employee, Business" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required />
                                </div>
                            </div>
                        </div>
                    
                        <!-- Section 2: Adoption Intent -->
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <h3 class="text-blue-600 font-bold flex items-center gap-2 mb-4">
                                <i class="fa-solid fa-heart"></i> Adoption Intent
                            </h3>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">Why do you want to adopt? <span class="text-red-500">*</span></label>
                                <textarea id="app-intent" name="adoption_intent" rows="3" placeholder="Share your reason to adopt a pet..." class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required></textarea>
                            </div>
                        </div>
                    
                        <!-- Section 3: Emergency Contact -->
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <h3 class="text-blue-600 font-bold flex items-center gap-2 mb-4">
                                <i class="fa-solid fa-phone"></i> Emergency Contact
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Contact Person Name <span class="text-red-500">*</span></label>
                                    <input type="text" id="app-emergency-name" name="emergency_name" placeholder="Full Name" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Emergency Phone Number <span class="text-red-500">*</span></label>
                                    <input type="tel" id="app-emergency-phone" name="emergency_phone" placeholder="09123456789" maxlength="11" pattern="09[0-9]{9}" title="Must be a valid PH phone number starting with 09 (11 digits)" class="ph-phone-input w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Relationship <span class="text-red-500">*</span></label>
                                    <input type="text" id="app-emergency-relation" name="emergency_relation" placeholder="Parent / Sibling / Friend" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-400 border-gray-200" required />
                                </div>
                            </div>
                        </div>
                    
                        <!-- Section 4: Requirement -->
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <h3 class="text-blue-600 font-bold flex items-center gap-2 mb-4">
                                <i class="fa-solid fa-file-arrow-up"></i> Requirements
                            </h3>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">Upload Valid ID / Proof of Residence (PDF/Image) <span class="text-red-500">*</span></label>
                                <input type="file" id="app-document" name="document" class="w-full border border-gray-200 rounded-xl p-2 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" required />
                            </div>
                        </div>
                    
                        <!-- Action Buttons -->
                        <div class="flex justify-end gap-3 pt-4">
                            <button id="appCancelBtn" type="button" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-3 rounded-xl font-semibold transition-colors">
                                Cancel
                            </button>
                            <button id="appSubmitBtn" type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold shadow-sm transition-colors">
                                Submit Application
                            </button>
                        </div>
                    </form>
                </div>

                <!-- ===== MODAL VIEW ===== -->
                <div id="viewPetModal" class="fixed inset-0 hidden z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-6">
                    <div class="bg-white rounded-3xl w-full max-w-6xl max-h-[90vh] overflow-hidden flex">

                        <!-- LEFT -->
                        <div class="w-1/3 bg-gray-50 border-r p-6">
                            <img id="modalImage" class="w-full rounded-2xl aspect-square object-cover mb-4" alt="Pet Image">

                            <div class="space-y-3">
                                <div class="bg-white rounded-xl border p-3">
                                    <p class="text-[11px] font-bold text-blue-700 mb-2">Species</p>
                                    <p id="modalSpecies" class="font-semibold text-slate-800 mt-1"></p>
                                </div>

                                <div class="bg-white rounded-xl border p-3">
                                    <p class="text-[11px] font-bold text-blue-700 mb-2">Gender</p>
                                    <p id="modalGender" class="font-semibold mt-1"></p>
                                </div>

                                <div class="bg-white rounded-xl border p-3">
                                    <p class="text-[11px] font-bold text-blue-700 mb-2">Age</p>
                                    <p id="modalAge" class="font-semibold mt-1"></p>
                                </div>
                            </div>
                        </div>

                        <!-- RIGHT -->
                        <div class="flex-1 overflow-y-auto hide-scrollbar p-5">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h1 id="modalName" class="text-4xl font-bold"></h1>
                                    <div class="flex flex-wrap gap-3 mt-4">
                                        <span id="modalStatus" class="px-4 py-2 rounded-full text-sm font-medium"></span>
                                        <span id="modalHealth" class="px-4 py-2 rounded-full text-sm font-medium"></span>
                                        <span id="modalVaccination" class="px-4 py-2 rounded-full text-sm font-medium"></span>
                                    </div>
                                </div>
                                <button onclick="closePetModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                                    <i class="fa-solid fa-xmark text-3xl"></i>
                                </button>
                            </div>

                            <div class="mt-5">
                                <h3 class="font-bold text-blue-700 mb-2">Personality</h3>
                                <div id="modalTags" class="flex flex-wrap gap-2"></div>
                            </div>

                            <div class="mt-5">
                                <h3 class="font-bold text-blue-700 mb-2">Pet Description</h3>
                                <p id="modalBehavior" class="text-gray-600 leading-relaxed text-justify"></p>
                            </div>

                            <!-- Medical History -->
                            <div class="mt-5">
                                <h3 class="font-bold text-blue-700 mb-2">Medical History</h3>
                                <div class="overflow-x-auto border rounded-2xl">
                                    <table class="w-full">
                                        <thead class="bg-blue-700 text-white">
                                            <tr>
                                                <th class="text-left p-3">Treatment</th>
                                                <th class="text-left p-3">Date</th>
                                                <th class="text-left p-3">Administered By</th>
                                            </tr>
                                        </thead>
                                        <tbody id="modalMedicalBody">
                                            <tr>
                                                <td colspan="3" class="text-center p-6 text-gray-400">
                                                    No medical records.
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <button id="applyModalBtn" class="mt-8 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors">
                                Apply for Adoption
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>

        <!--Custom Modal -->
        <div id="customModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4 transition-all duration-300">
            <div class="w-full max-w-sm transform overflow-hidden rounded-2xl bg-white p-6 text-center shadow-2xl transition-all scale-95" id="modalContainer">
                
                <!-- Icon Container -->
                <div id="modalIconContainer" class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-blue-100 text-blue-500">
                    <!-- Dynamic Icon (Success / Error) -->
                    <svg id="modalIcon" class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>

                <!-- Title & Message -->
                <h3 id="modalTitle" class="text-xl font-bold text-gray-800">Success!</h3>
                <p id="modalMessage" class="mt-2 text-sm text-gray-600">Your application has been submitted.</p>

                <!-- Action Button -->
                <div class="mt-6">
                    <button id="modalBtn" onclick="closeModal()" class="w-full rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-md transition-all hover:bg-blue-700 active:scale-95">
                        Continue
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            // Wait until sidebar + header are loaded
            await loadSidebar();

            requestAnimationFrame(() => {
                loadTopbar({
                    title: "Adoption Hub",
                    subtitle: "Browse available pets, view their profiles, and begin your adoption journey."
                });

                document.body.style.visibility = "visible";
            });

            // Helper function to return to Pet List
            function returnToPetList() {
                document.getElementById('application-view').classList.add('hidden');
                document.getElementById('list-view').classList.remove('hidden');

                if (typeof loadTopbar === 'function') {
                    loadTopbar({
                        title: "Adoption Hub",
                        subtitle: "Browse available pets, view their profiles, and begin your adoption journey."
                    });
                }
            }

            // 1. Kapag pinindot ang Apply Button sa Modal
            const applyBtn = document.getElementById('applyModalBtn');
            if (applyBtn) {
                applyBtn.addEventListener('click', function() {
                    // Kunin ang Pet ID mula sa dataset attribute o global window object
                    const selectedPetId = this.dataset.petId || (window.currentSelectedPet ? window.currentSelectedPet.id : '');
                    
                    // Isulat ang Pet ID sa hidden input ng form
                    const hiddenInput = document.getElementById('selectedPetId');
                    if (hiddenInput) {
                        hiddenInput.value = selectedPetId;
                    }

                    // Kung walang napiling pet ID, magbigay ng babala
                    if (!selectedPetId) {
                        console.warn("Warning: No Pet ID found on the apply button.");
                    }

                    // Close pet detail modal
                    if (typeof closePetModal === 'function') closePetModal();

                    // Switch views
                    document.getElementById('list-view').classList.add('hidden');
                    document.getElementById('application-view').classList.remove('hidden');

                    // Update Topbar Title
                    if (typeof loadTopbar === 'function') {
                        loadTopbar({
                            title: "Adoption Form",
                            subtitle: "Please fill out the form below to start your adoption journey"
                        });
                    }
                });
            }

            // 2. Kapag pinindot ang Back Button mula sa Application Form
            const backBtn = document.getElementById('appBackBtn');
            if (backBtn) {
                backBtn.addEventListener('click', returnToPetList);
            }

            // 3. Kapag pinindot ang Cancel Button sa Form
            const cancelBtn = document.getElementById('appCancelBtn');
            if (cancelBtn) {
                cancelBtn.addEventListener('click', function() {
                    const form = document.getElementById('adoptionForm');
                    if (form) form.reset(); // I-clear ang mga na-type sa form
                    returnToPetList();
                });
            }

            // 4. Input restriction para PH Phone Numbers lamang
            document.querySelectorAll('.ph-phone-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                });
            });

            // 5. Input restriction para sa Age Field (Whole positive numbers lang, max 2 digits)
            const ageInput = document.getElementById('app-age');
            if (ageInput) {
                ageInput.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    if (e.target.value.length > 2) {
                        e.target.value = e.target.value.slice(0, 2);
                    }
                });
            }

            // 6. Submit Application Event Handler
            const adoptionForm = document.getElementById('adoptionForm');
            if (adoptionForm) {
                adoptionForm.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const petId = document.getElementById('selectedPetId').value;
                    if (!petId) {
                        alert("Please select a pet first!");
                        return;
                    }

                    // Kukuha ng lahat ng inputs pati na ang in-upload na file
                    const formData = new FormData(this);

                    const submitBtn = document.getElementById('appSubmitBtn');
                    submitBtn.disabled = true;
                    submitBtn.innerText = "Submitting...";

                    try {
                        const response = await fetch('/api/adoptions/submit-application', {
                            method: 'POST',
                            credentials: 'include',
                            body: formData
                        });

                        const result = await response.json();

                        if (response.ok) {
                            // Call our Tailwind Modal!
                            showModal('Success!', result.message, true, () => {
                                // This will execute after clicking the button (optional)
                                window.location.reload(); 
                            });
                        } else {
                            showModal('Error!', result.message || result.error, false);
                        }
                    } catch (error) {
                        showModal('Server Error', 'Unable to connect to the server. Please try again.', false);
                    }
                });
            }

        });

        let modalCallback = null;

        function showModal(title, message, isSuccess = true, callback = null) {
            const modal = document.getElementById('customModal');
            const container = document.getElementById('modalContainer');
            const iconContainer = document.getElementById('modalIconContainer');
            const icon = document.getElementById('modalIcon');
            const titleEl = document.getElementById('modalTitle');
            const messageEl = document.getElementById('modalMessage');
            const btn = document.getElementById('modalBtn');

            titleEl.textContent = title;
            messageEl.textContent = message;
            modalCallback = callback;

            if (isSuccess) {
                // Blue Theme para sa Success
                iconContainer.className = "mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-blue-100 text-blue-600";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>`;
                btn.className = "w-full rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-md transition-all hover:bg-blue-700 active:scale-95";
            } else {
                // Red Theme para sa Error
                iconContainer.className = "mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-red-100 text-red-600";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`;
                btn.className = "w-full rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-md transition-all hover:bg-red-700 active:scale-95";
            }

            // Isagawa ang Smooth Pop Animation
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const container = document.getElementById('modalContainer');

            container.classList.remove('scale-100');
            container.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
                if (modalCallback) modalCallback();
            }, 150);
        }
    </script>
</body>

</html>
