<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/images/Pawpon_logo.png">
    <title>PAWPON – Contact & Feedback</title>

    <link rel="stylesheet" href="/assets/css/tailwind.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="../assets/js/userSidebar.js"></script>
    <script src="../assets/js/userHeader.js"></script>

    <style>
        * {
            box-sizing: border-box;
            scrollbar-width: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            overscroll-behavior: none;
            visibility: hidden;
        }

        #sidebar,
        #header {
            visibility: hidden;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-100 h-full overflow-hidden">

    <!-- Sidebar -->
    <div id="sidebar" class="fixed left-0 top-0 w-64 h-screen bg-white border-r border-gray-200 z-50">
    </div>

    <!-- Main content -->
    <main class="ml-64 pt-24 h-screen overflow-hidden bg-gray-50">

        <!-- Header -->
        <div id="header" class="fixed top-0 left-64 right-0 h-24 bg-white border-b border-gray-200 z-40">
        </div>

        <!-- Page content -->
        <div class="h-[calc(100vh-6rem)] overflow-y-auto p-6 lg:p-8">

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 lg:gap-8">

                <!-- =================================================
                     CONTACT US
                ================================================== -->
                <div class="bg-white rounded-2xl shadow-md border p-6 lg:p-7">

                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-11 h-11 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center">
                            <i class="fas fa-headset"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-gray-800">Contact Us</h2>
                            <p class="text-xs text-gray-500 mt-0.5">We're here to help with anything Pawpon-related.</p>
                        </div>
                    </div>

                    <!-- Fast Resolution Banner -->
                    <div class="relative rounded-xl bg-gradient-to-r from-blue-500 to-blue-400 p-4 text-white mb-6 overflow-hidden">
                        <div class="absolute right-0 top-0 opacity-10">
                            <i class="fas fa-bolt text-7xl"></i>
                        </div>
                        <div class="relative flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-white/15 flex items-center justify-center shrink-0">
                                <i class="fas fa-bolt text-yellow-200"></i>
                            </div>
                            <div>
                                <p class="text-sm font-bold">Need help fast?</p>
                                <p class="text-xs text-blue-100 mt-0.5 leading-5">
                                    Send us your concern below and provide as much detail as possible.
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Contact Items -->
                    <div class="space-y-3">
                        <div class="flex items-center gap-4 p-3.5 rounded-xl border border-gray-200 bg-white hover:border-blue-200 hover:bg-blue-50/40 transition">
                            <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center shrink-0">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Email</p>
                                <p id="contactEmail" class="text-sm font-semibold text-gray-700 mt-0.5 truncate">Loading...</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-4 p-3.5 rounded-xl border border-gray-200 bg-white hover:border-green-200 hover:bg-green-50/40 transition">
                            <div class="w-10 h-10 rounded-lg bg-green-100 text-green-600 flex items-center justify-center shrink-0">
                                <i class="fas fa-phone"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Contact Number</p>
                                <p id="contactPhone" class="text-sm font-semibold text-gray-700 mt-0.5">Loading...</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-4 p-3.5 rounded-xl border border-gray-200 bg-white hover:border-amber-200 hover:bg-amber-50/40 transition">
                            <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center shrink-0">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Support Hours</p>
                                <p id="contactHoursDays" class="text-sm font-semibold text-gray-700 mt-0.5">Loading...</p>
                                <p id="contactHoursTime" class="text-xs text-gray-500">&nbsp;</p>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- =================================================
                     SEND FEEDBACK
                ================================================== -->
                <div class="bg-white rounded-2xl shadow-md border p-6 lg:p-7">

                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-11 h-11 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center">
                            <i class="fas fa-comments"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-gray-800">Send Feedback</h2>
                            <p class="text-xs text-gray-500 mt-0.5">Report an issue or share a suggestion.</p>
                        </div>
                    </div>

                    <form id="feedbackForm" class="space-y-5" novalidate>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="feedbackType" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
                                    Feedback Type
                                </label>
                                <select
                                    id="feedbackType"
                                    name="feedbackType"
                                    required
                                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 transition"
                                >
                                    <option value="" disabled selected>Select a type</option>
                                    <option value="Report a Bug">Report a Bug</option>
                                    <option value="Feature Suggestion">Feature Suggestion</option>
                                    <option value="General Feedback">General Feedback</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
                                    How's your experience? <span class="normal-case text-gray-400">(optional)</span>
                                </label>
                                <div id="feedbackRating" class="flex items-center gap-1.5 h-[42px]">
                                    <button type="button" data-rating="1" class="rating-star text-xl text-gray-300 hover:text-amber-400 transition">
                                        <i class="fas fa-star"></i>
                                    </button>
                                    <button type="button" data-rating="2" class="rating-star text-xl text-gray-300 hover:text-amber-400 transition">
                                        <i class="fas fa-star"></i>
                                    </button>
                                    <button type="button" data-rating="3" class="rating-star text-xl text-gray-300 hover:text-amber-400 transition">
                                        <i class="fas fa-star"></i>
                                    </button>
                                    <button type="button" data-rating="4" class="rating-star text-xl text-gray-300 hover:text-amber-400 transition">
                                        <i class="fas fa-star"></i>
                                    </button>
                                    <button type="button" data-rating="5" class="rating-star text-xl text-gray-300 hover:text-amber-400 transition">
                                        <i class="fas fa-star"></i>
                                    </button>
                                    <input type="hidden" id="feedbackRatingValue" name="rating" value="" />
                                </div>
                            </div>
                        </div>

                        <div>
                            <label for="feedbackSubject" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
                                Subject
                            </label>
                            <input
                                type="text"
                                id="feedbackSubject"
                                name="subject"
                                required
                                maxlength="120"
                                placeholder="Briefly describe your feedback"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 transition"
                            />
                        </div>

                        <div>
                            <label for="feedbackMessage" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
                                Message
                            </label>
                            <textarea
                                id="feedbackMessage"
                                name="message"
                                required
                                minlength="10"
                                maxlength="2000"
                                rows="5"
                                placeholder="Tell us more about the issue or suggestion."
                                class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 transition resize-none"
                            ></textarea>
                            <div class="flex justify-end mt-1.5">
                                <span id="feedbackCharCount" class="text-[11px] text-gray-400">0 / 2000</span>
                            </div>
                        </div>

                        <div id="feedbackStatus" class="hidden rounded-xl px-4 py-3 text-sm font-medium"></div>

                        <!-- Submit Button -->
                        <div class="flex items-center justify-end pt-1">
                            <button
                                type="submit"
                                id="feedbackSubmitBtn"
                                class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold shadow-sm transition disabled:opacity-60 disabled:cursor-not-allowed"
                            >
                                <i class="fa-solid fa-paper-plane text-xs"></i>
                                <span>Submit Feedback</span>
                            </button>
                        </div>

                    </form>
                </div>

            </div>

        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await loadSidebar();

            requestAnimationFrame(() => {
                loadTopbar({
                    title: "Contact & Feedback",
                    subtitle: "Reach out to Pawpon support or share your feedback with us."
                });
                document.body.style.visibility = "visible";
            });
        });

        // =============================================
        // SEND FEEDBACK FORM
        // =============================================
        (() => {
            const form = document.getElementById("feedbackForm");
            if (!form) return;

            const messageField = document.getElementById("feedbackMessage");
            const charCount = document.getElementById("feedbackCharCount");
            const statusBox = document.getElementById("feedbackStatus");
            const submitBtn = document.getElementById("feedbackSubmitBtn");
            const ratingButtons = document.querySelectorAll(".rating-star");
            const ratingValueInput = document.getElementById("feedbackRatingValue");

            let selectedRating = 0;

            messageField.addEventListener("input", () => {
                charCount.textContent = `${messageField.value.length} / 2000`;
            });

            function paintStars(rating) {
                ratingButtons.forEach(btn => {
                    const starValue = Number(btn.dataset.rating);
                    const icon = btn.querySelector("i");
                    if (starValue <= rating) {
                        icon.classList.remove("text-gray-300");
                        icon.classList.add("text-amber-400");
                    } else {
                        icon.classList.remove("text-amber-400");
                        icon.classList.add("text-gray-300");
                    }
                });
            }

            ratingButtons.forEach(btn => {
                btn.addEventListener("click", () => {
                    const value = Number(btn.dataset.rating);
                    selectedRating = (selectedRating === value) ? 0 : value;
                    ratingValueInput.value = selectedRating || "";
                    paintStars(selectedRating);
                });

                btn.addEventListener("mouseenter", () => {
                    paintStars(Number(btn.dataset.rating));
                });
            });

            document.getElementById("feedbackRating").addEventListener("mouseleave", () => {
                paintStars(selectedRating);
            });

            function showStatus(type, text) {
                statusBox.classList.remove(
                    "hidden", "bg-green-50", "text-green-700", "border", "border-green-100",
                    "bg-red-50", "text-red-700", "border-red-100"
                );

                if (type === "success") {
                    statusBox.classList.add("bg-green-50", "text-green-700", "border", "border-green-100");
                } else {
                    statusBox.classList.add("bg-red-50", "text-red-700", "border", "border-red-100");
                }

                statusBox.textContent = text;
            }

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                statusBox.classList.add("hidden");

                if (!form.checkValidity()) {
                    showStatus("error", "Please fill in the required fields before submitting.");
                    form.reportValidity();
                    return;
                }

                const payload = {
                    feedback_type: document.getElementById("feedbackType").value,
                    subject: document.getElementById("feedbackSubject").value.trim(),
                    message: messageField.value.trim(),
                    rating: selectedRating || null
                };

                submitBtn.disabled = true;
                const originalBtnHTML = submitBtn.innerHTML;
                submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin text-xs"></i><span>Sending...</span>`;

                try {
                    const response = await fetch("/api/feedback", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`Request failed with status ${response.status}`);
                    }

                    showStatus("success", "Thanks! Your feedback has been sent to the Pawpon team.");
                    form.reset();
                    selectedRating = 0;
                    ratingValueInput.value = "";
                    paintStars(0);
                    charCount.textContent = "0 / 2000";
                } catch (error) {
                    console.error("Unable to submit feedback:", error);
                    showStatus("error", "Something went wrong sending your feedback. Please try again or email us directly.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnHTML;
                }
            });
        })();

                // =============================================
        // LOAD SITE CONTACT INFO
        // =============================================
        (async () => {
            try {
                const res = await fetch("/api/contact-info");
                const data = await res.json();
                if (data.success && data.contactInfo) {
                    document.getElementById("contactEmail").textContent = data.contactInfo.support_email || "—";
                    document.getElementById("contactPhone").textContent = data.contactInfo.support_phone || "—";
                    document.getElementById("contactHoursDays").textContent = data.contactInfo.support_hours_days || "—";
                    document.getElementById("contactHoursTime").textContent = data.contactInfo.support_hours_time || "";
                }
            } catch (err) {
                console.error("Failed to load contact info:", err);
                document.getElementById("contactEmail").textContent = "pawssion_admin@gmail.com";
                document.getElementById("contactPhone").textContent = "(+63) 951 450 1937";
                document.getElementById("contactHoursDays").textContent = "Monday – Friday";
                document.getElementById("contactHoursTime").textContent = "8:00 AM – 5:00 PM";
            }
        })();
    </script>
</body>
</html>
