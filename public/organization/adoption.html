<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organization Dashboard - Adoption Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="../assets/js/orgSidebar.js"></script>
    <script src="../assets/js/orgTopbar.js"></script>
</head>
<body class="bg-slate-100 font-['Inter',_sans-serif] min-h-screen">

    <div id="headerContainer"></div>
    <div id="sidebarContainer"></div>

    <main id="mainContent"
        class="pt-28 pb-12 px-4 md:px-8 transition-all duration-200 ease-in-out left-0 md:ml-[280px] data-[sidebar-collapsed=true]:md:ml-20">

        <!-- Stat Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-100 text-blue-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-regular fa-file-lines"></i>
                    </div>
                    <div>
                        <span class="text-sm font-semibold text-gray-700 block">Under Review</span>
                        <span id="statActiveApps" class="text-3xl font-bold text-gray-900 block mt-0.5">0</span>
                        <span class="text-xs text-blue-500 font-medium">Requires your review</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-green-100 text-green-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-regular fa-circle-check"></i>
                    </div>
                    <div>
                        <span class="text-sm font-semibold text-gray-700 block">Approved</span>
                        <span id="statSuccessfulApps" class="text-3xl font-bold text-gray-900 block mt-0.5">0</span>
                        <span class="text-xs text-green-500 font-medium">Completed</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-orange-100 text-orange-400 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-user-xmark"></i>
                    </div>
                    <div>
                        <span class="text-sm font-semibold text-gray-700 block">Declined</span>
                        <span id="statDeclinedApps" class="text-3xl font-bold text-gray-900 block mt-0.5">0</span>
                        <span class="text-xs text-orange-400 font-medium">This Year</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-pink-100 text-pink-500 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-regular fa-calendar-days"></i>
                    </div>
                    <div>
                        <span class="text-sm font-semibold text-gray-700 block">Interviews Scheduled</span>
                        <span id="statInterviewApps" class="text-3xl font-bold text-gray-900 block mt-0.5">0</span>
                        <span class="text-xs text-pink-500 font-medium">Upcoming</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-6">
            <div class="relative flex-1 max-w-xl">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input id="searchInput" type="text" placeholder="Search by applicant name, pet name..." 
                    class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:border-blue-500" />
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <select id="statusFilter" class="bg-white border border-gray-200 text-gray-700 px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-50 focus:outline-none cursor-pointer">
                    <option value="ALL">All Status</option>
                    <option value="UNDER_REVIEW">Under Review</option>
                    <option value="INTERVIEW_SCHEDULED">Interview Scheduled</option>
                    <option value="APPROVED">Approved</option>
                    <option value="DECLINED">Declined</option>
                </select>

                <button id="exportBtn" class="bg-white border border-gray-200 text-gray-700 px-4 py-2.5 rounded-lg text-sm font-medium inline-flex items-center gap-2 hover:bg-gray-50">
                    <i class="fa-solid fa-file-export text-gray-500"></i> Export Summary
                </button>
            </div>
        </div>

        <!-- Applications Table -->
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            <th class="py-4 px-6">Applicant</th>
                            <th class="py-4 px-6">Target Pet</th>
                            <th class="py-4 px-6">Status</th>
                            <th class="py-4 px-6">Applied Date</th>
                            <th class="py-4 px-6 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                        <tr>
                            <td colspan="5" class="py-8 text-center text-gray-400">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                                <p>Loading applications...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Container -->
            <div class="bg-white border-t border-gray-100 px-6 py-4 flex items-center justify-between">
                <span id="paginationInfo" class="text-sm text-gray-500">Showing 0 of 0 results</span>
                <div class="flex items-center gap-2" id="paginationControls">
                    <!-- Pagination buttons -->
                </div>
            </div>
        </div>

        <!-- Logout Modal -->
        <div id="logoutModal" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/45 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
            <div class="bg-white rounded-2xl max-w-sm w-full mx-4 p-6 shadow-2xl scale-95 transition-transform duration-200">
                <div class="text-center">
                    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-50 mb-4">
                        <i class="fa-solid fa-right-from-bracket text-red-600 text-lg"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900">Logging Out?</h3>
                    <p class="text-sm text-gray-500 mt-2">Are you sure you want to leave the Pawpon Org Portal?</p>
                </div>
                <div class="mt-6 flex gap-3">
                    <button id="cancelLogoutBtn" class="flex-1 px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl transition text-sm">
                        Cancel
                    </button>
                    <button id="confirmLogoutBtn" class="flex-1 px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white font-medium rounded-xl transition shadow-sm shadow-red-200 text-sm">
                        Yes, Logout
                    </button>
                </div>
            </div>
        </div>
    </main>

<script>
    let allApplications = [];

    document.addEventListener("DOMContentLoaded", async () => {
        // 1. Load Shared Components
        if (typeof loadTopbar === "function") {
            await loadTopbar({
                title: "Adoption Application",
                subtitle: "Review and Manage Adoption application from potential adopters"
            });
        }
        if (typeof loadSidebar === "function") {
            await loadSidebar("dashboard");
        }

        // 2. Fetch Applications Data from Backend
        await fetchAdoptionApplications();

        // 3. Search & Filter Event Listeners
        document.getElementById("searchInput")?.addEventListener("input", filterAndRenderTable);
        document.getElementById("statusFilter")?.addEventListener("change", filterAndRenderTable);
    });

    // Fetch applications from REST API
    async function fetchAdoptionApplications() {
        const tableBody = document.getElementById("applicationsTableBody");

        try {
            const response = await fetch("/api/organization/applications", {
                method: "GET",
                headers: { "Content-Type": "application/json" },
                credentials: "include"
            });
            
            if (!response.ok) throw new Error("Failed to load applications");

            allApplications = await response.json();

            // Dynamic count update para sa cards
            updateStatCards(allApplications);

            // Render table rows
            filterAndRenderTable();

        } catch (error) {
            console.error("Error fetching adoption applications:", error);
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="py-8 text-center text-red-500 font-medium">
                        <i class="fa-solid fa-triangle-exclamation text-xl mb-1 block"></i>
                        Failed to fetch data. Please try again.
                    </td>
                </tr>
            `;
        }
    }

    // Helper: Update Stat Cards
    function updateStatCards(data) {
        // Tinatrato din ang 'PENDING' bilang 'UNDER_REVIEW' kung may pumasok man mula sa lumang DB records
        const active = data.filter(a => a.status === "UNDER_REVIEW" || a.status === "PENDING").length;
        const approved = data.filter(a => a.status === "APPROVED").length;
        const declined = data.filter(a => a.status === "DECLINED").length;
        const interview = data.filter(a => a.status === "INTERVIEW_SCHEDULED").length;

        document.getElementById("statActiveApps").textContent = active;
        document.getElementById("statSuccessfulApps").textContent = approved;
        document.getElementById("statDeclinedApps").textContent = declined;
        document.getElementById("statInterviewApps").textContent = interview;
    }

    // Helper: Filter & Render Function
    function filterAndRenderTable() {
        const searchVal = document.getElementById("searchInput").value.toLowerCase();
        const statusVal = document.getElementById("statusFilter").value;

        const filtered = allApplications.filter(app => {
            const matchesSearch = 
                (app.applicant_name || '').toLowerCase().includes(searchVal) ||
                (app.applicant_email || '').toLowerCase().includes(searchVal) ||
                (app.pet_name || '').toLowerCase().includes(searchVal);

            // Kung ang napiling filter ay UNDER_REVIEW, isasali rin ang PENDING kung meron
            let appStatus = app.status;
            if (appStatus === 'PENDING') appStatus = 'UNDER_REVIEW';

            const matchesStatus = statusVal === "ALL" || appStatus === statusVal;

            return matchesSearch && matchesStatus;
        });

        renderTableRows(filtered);
    }

    // Helper: Render Dynamic HTML Rows
    function renderTableRows(applications) {
        const tableBody = document.getElementById("applicationsTableBody");
        const paginationInfo = document.getElementById("paginationInfo");

        if (applications.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="py-8 text-center text-gray-400">
                        No adoption applications found.
                    </td>
                </tr>
            `;
            paginationInfo.textContent = "Showing 0 of 0 results";
            return;
        }

        const fallbackImg = "https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&q=80&w=80&h=80";

        tableBody.innerHTML = applications.map(app => {
            const statusBadge = getStatusBadgeHTML(app.status);
            
            let petImage = app.pet_image;
            if (!petImage) {
                petImage = fallbackImg;
            } else if (!petImage.startsWith("http") && !petImage.startsWith("/")) {
                petImage = `/uploads/pets/${petImage}`; 
            }

            return `
                <tr class="hover:bg-gray-50/50">
                    <td class="py-4 px-6">
                        <span class="font-semibold text-gray-900 block">${escapeHtml(app.applicant_name)}</span>
                        <span class="text-xs text-gray-400 block mt-0.5">${escapeHtml(app.applicant_email)}</span>
                    </td>
                    <td class="py-4 px-6">
                        <div class="flex items-center gap-3">
                            <img src="${petImage}" 
                                 alt="${escapeHtml(app.pet_name)}" 
                                 onerror="this.onerror=null; this.src='${fallbackImg}';"
                                 class="w-9 h-9 rounded-full object-cover border border-gray-100" />
                            <div>
                                <span class="font-semibold text-gray-900 block">${escapeHtml(app.pet_name)}</span>
                                <span class="text-xs text-gray-400 block mt-0.5">${escapeHtml(app.pet_type || "Pet")} · ${escapeHtml(app.pet_gender || "")}</span>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-6">
                        ${statusBadge}
                    </td>
                    <td class="py-4 px-6">
                        <span class="font-medium text-gray-900 block">${app.applied_date || ''}</span>
                        <span class="text-xs text-gray-400 block mt-0.5">${app.applied_time || ""}</span>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <button onclick="viewApplicationDetails('${app.id}')" class="text-gray-400 hover:text-blue-600 transition-colors" title="View Application">
                            <i class="fa-regular fa-eye text-lg"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');

        paginationInfo.textContent = `Showing 1 to ${applications.length} of ${applications.length} results`;
    }

    // Status Badge Component Helper (May kasamang eksaktong design tulad ng sa image)
    function getStatusBadgeHTML(status) {
        const cleanStatus = (status || '').toUpperCase();

        switch (cleanStatus) {
            case 'UNDER_REVIEW':
            case 'PENDING': // Awtomatikong ipapakita bilang 'Under Review'
                return `<span class="inline-flex px-3 py-1 text-xs font-semibold bg-amber-100/70 text-amber-600 rounded-full">Under Review</span>`;
            
            case 'INTERVIEW_SCHEDULED':
                return `<span class="inline-flex px-3 py-1 text-xs font-semibold bg-blue-100/70 text-blue-600 rounded-full">Interview Scheduled</span>`;
            
            case 'APPROVED':
                return `<span class="inline-flex px-3 py-1 text-xs font-semibold bg-emerald-100/70 text-emerald-600 rounded-full">Approved</span>`;
            
            case 'DECLINED':
                return `<span class="inline-flex px-3 py-1 text-xs font-semibold bg-rose-100/80 text-rose-500 rounded-full">Declined</span>`;
            
            default:
                return `<span class="inline-flex px-3 py-1 text-xs font-semibold bg-gray-100 text-gray-600 rounded-full">${escapeHtml(status)}</span>`;
        }
    }

    // Action Handler
    function viewApplicationDetails(applicationId) {
        window.location.href = `/org/application-details.html?id=${applicationId}`;
    }

    // Utility to prevent XSS
    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }
</script>
<script src="/assets/js/orgProfile.js"></script> 
</body>
</html>
