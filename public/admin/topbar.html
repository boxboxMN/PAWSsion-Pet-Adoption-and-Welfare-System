<div class="flex items-center justify-between px-6 py-3.5 border-b border-slate-200/80 bg-white/70 backdrop-blur-xl shadow-xs sticky top-0 z-40">

    <!-- Page Title & Subtitle -->
    <div class="flex flex-col">
        <h1 id="topbarTitle" class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight leading-tight">
            Dashboard
        </h1>
        <p id="topbarSubtitle" class="text-xs sm:text-sm text-slate-500 font-medium">
            Welcome back.
        </p>
    </div>

    <!-- Right Controls Container -->
    <div class="flex items-center gap-2.5 sm:gap-3.5">

        <!-- Notification Bell & Dropdown Wrapper -->
        <div class="relative" id="notificationWrapper">
            <!-- Notification Button -->
            <button 
                id="notificationBellBtn" 
                class="relative w-10 h-10 flex items-center justify-center rounded-xl bg-white border border-slate-200/80 text-slate-600 hover:text-blue-600 hover:border-blue-200 hover:bg-blue-50/50 active:scale-95 transition-all duration-200 shadow-xs hover:shadow-sm"
                aria-label="Notifications"
            >
                <i class="fa-regular fa-bell text-base"></i>

                <!-- Unread Pulse Badge Indicator -->
                <span class="absolute top-2 right-2 flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500 ring-2 ring-white"></span>
                </span>
            </button>

            <!-- Notification Dropdown -->
            <div 
                id="notificationDropdown" 
                class="hidden absolute right-0 top-full mt-3 w-80 sm:w-96 bg-white/95 backdrop-blur-2xl rounded-2xl border border-slate-200/90 shadow-2xl z-[9999] overflow-hidden transform transition-all duration-200"
            >
                <!-- Dropdown Header -->
                <div class="px-5 py-3.5 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-bell text-blue-600 text-xs"></i>
                            Notifications
                        </h3>
                        <p class="text-[11px] text-slate-400 font-medium mt-0.5">Latest updates & alerts</p>
                    </div>
                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2.5 py-0.5 rounded-full border border-blue-100">New</span>
                </div>

                <!-- Dropdown Scroll List -->
                <div class="divide-y divide-slate-100 max-h-80 overflow-y-auto custom-scrollbar">
                    <!-- Notification Item -->
                    <div class="px-5 py-3.5 hover:bg-slate-50/80 cursor-pointer transition-colors duration-150 group">
                        <div class="flex items-start gap-3">
                            <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center flex-shrink-0 group-hover:bg-blue-600 group-hover:text-white transition-all duration-200 shadow-xs">
                                <i class="fa-solid fa-building text-xs"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="font-semibold text-slate-800 text-xs sm:text-sm group-hover:text-blue-600 transition-colors">New Organization Registered</p>
                                <p class="text-xs text-slate-500 mt-0.5 line-clamp-2 leading-relaxed">A new organization submitted a partner request.</p>
                                <p class="text-[11px] text-slate-400 mt-1.5 flex items-center gap-1 font-medium">
                                    <i class="fa-regular fa-clock text-[10px]"></i> Just now
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dropdown Footer -->
                <div class="px-5 py-2.5 bg-slate-50/80 border-t border-slate-100 text-center">
                    <a href="#" class="text-blue-600 font-semibold text-xs hover:text-blue-700 transition-all flex items-center justify-center gap-1.5 py-1">
                        View All Notifications
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Profile Chip (No Settings) -->
        <div class="flex items-center gap-3 pl-2 sm:pl-3 border-l border-slate-200/80">
            <div class="flex items-center gap-3 p-1 sm:pr-3 rounded-xl hover:bg-slate-100/60 cursor-pointer transition-colors duration-150 group">
                <!-- User Avatar -->
                <div class="relative">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-xs group-hover:shadow-md transition-shadow">
                        A
                    </div>
                    <!-- Online Status Indicator Dot -->
                    <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white shadow-xs"></span>
                </div>

                <!-- User Information -->
                <div class="hidden sm:block text-left">
                    <p class="font-bold text-slate-800 leading-tight text-sm group-hover:text-blue-600 transition-colors">
                        Administrator
                    </p>
                    <p class="text-[11px] text-slate-400 font-semibold tracking-wide uppercase mt-0.5">
                        System Admin
                    </p>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Custom Scrollbar -->
<style>
    .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }
</style>
