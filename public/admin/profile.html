<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/images/Pawpon_logo.png">
    <title>PAWPON ADMIN – My Profile </title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/inter.css">
 <!-- Local Font Awesome -->
<link rel="stylesheet" href="/css/fontawesome/all.min.css">
 <link rel="stylesheet" href="/css/tailwind.css">
    <script src="../assets/js/adminSidebar.js"></script>
    <script src="../assets/js/adminTopbar.js"></script>
    <script src="../assets/js/adminProfile.js"></script>
</head>
<body class="h-full font-sans text-slate-800 antialiased flex overflow-hidden bg-slate-50">

    <div id="sidebar" class="flex-shrink-0"></div>

    <main class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-white">
        <div id="topbar" class="flex-shrink-0 border-b border-slate-200"></div>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
            <div class="max-w-3xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
                <h2 class="text-lg font-bold text-slate-900 mb-1">Admin Profile Settings</h2>
                <p class="text-xs text-slate-500 mb-6">Update your account profile information and credentials.</p>

                <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

                <form id="adminProfileForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Name</label>
                        <input type="text" id="adminName" name="name" disabled class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-sm text-slate-500 cursor-not-allowed focus:outline-none" />
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="adminEmail" name="email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600" />
                    </div>

                    <hr class="border-slate-100" />

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Current Password <span class="text-rose-500">*</span></label>
                        <div class="relative">
                            <input type="password" id="adminCurrentPassword" name="currentPassword" required placeholder="Enter your current password to confirm changes" class="w-full px-4 py-2.5 pr-10 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600" />
                            <button type="button" id="toggleCurrentPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                <i id="eyeIconCurrent" class="fa-solid fa-eye text-sm"></i>
                            </button>
                        </div>
                        <p id="currentPasswordHint" class="text-[11px] text-slate-400 mt-1">Required to save any change to this profile.</p>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">New Password <span class="text-slate-400 font-normal">(Leave blank if unchanged)</span></label>
                        <div class="relative">
                            <input type="password" id="adminPassword" name="password" placeholder="Verify current password first" disabled class="w-full px-4 py-2.5 pr-10 rounded-xl border border-slate-200 bg-slate-100 text-sm text-slate-400 cursor-not-allowed focus:outline-none" />
                            <button type="button" id="togglePassword" disabled class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-300 cursor-not-allowed focus:outline-none">
                                <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
                            </button>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-1">Min. 8 characters, with uppercase, lowercase, a number, and a special character (@$!%*?&#).</p>
                    </div>

                    <div id="confirmPasswordWrapper" class="hidden">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Confirm New Password</label>
                        <input type="password" id="adminConfirmPassword" name="confirmPassword" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600" />
                    </div>

                    <div class="pt-4 flex justify-end">
                        <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-xl shadow-sm transition-all">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
