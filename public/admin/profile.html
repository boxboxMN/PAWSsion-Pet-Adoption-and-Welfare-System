<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/images/Pawpon_logo.png">
    <title>PAWPON ADMIN – My Profile </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/adminSidebar.js"></script>
    <script src="../assets/js/adminTopbar.js"></script>
</head>
<body class="h-full font-sans text-slate-800 antialiased flex overflow-hidden bg-slate-50">

    <div id="sidebar" class="flex-shrink-0"></div>

    <main class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-white">
        <div id="topbar" class="flex-shrink-0 border-b border-slate-200"></div>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
            <div class="max-w-3xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
                <h2 class="text-lg font-bold text-slate-900 mb-1">Admin Profile Settings</h2>
                <p class="text-xs text-slate-500 mb-6">Update your account profile information and credentials.</p>

                <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

                <form id="adminProfileForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Name</label>
                        <input type="text" id="adminName" name="name" disabled class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-sm text-slate-500 cursor-not-allowed focus:outline-none" />
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="adminEmail" name="email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600" />
                    </div>

                    <hr class="border-slate-100" />

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Current Password <span class="text-rose-500">*</span></label>
                        <div class="relative">
                            <input type="password" id="adminCurrentPassword" name="currentPassword" required placeholder="Enter your current password to confirm changes" class="w-full px-4 py-2.5 pr-10 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600" />
                            <button type="button" id="toggleCurrentPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                <i id="eyeIconCurrent" class="fa-solid fa-eye text-sm"></i>
                            </button>
                        </div>
                        <p id="currentPasswordHint" class="text-[11px] text-slate-400 mt-1">Required to save any change to this profile.</p>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">New Password <span class="text-slate-400 font-normal">(Leave blank if unchanged)</span></label>
                        <div class="relative">
                            <input type="password" id="adminPassword" name="password" placeholder="Verify current password first" disabled class="w-full px-4 py-2.5 pr-10 rounded-xl border border-slate-200 bg-slate-100 text-sm text-slate-400 cursor-not-allowed focus:outline-none" />
                            <button type="button" id="togglePassword" disabled class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-300 cursor-not-allowed focus:outline-none">
                                <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
                            </button>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-1">Min. 8 characters, with uppercase, lowercase, a number, and a special character (@$!%*?&#).</p>
                    </div>

                    <div id="confirmPasswordWrapper" class="hidden">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Confirm New Password</label>
                        <input type="password" id="adminConfirmPassword" name="confirmPassword" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600" />
                    </div>

                    <div class="pt-4 flex justify-end">
                        <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-xl shadow-sm transition-all">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            loadSidebar("setting");
            loadTopbar({ title: "Profile Settings", subtitle: "Manage your administrator account details." });

            const form = document.getElementById("adminProfileForm");
            const alertBox = document.getElementById("alertBox");

            // Fetch current profile data
            try {
                const res = await fetch('/admin/current-user');
                const data = await res.json();
                if (data.success && data.user) {
                    document.getElementById("adminName").value = data.user.name || "";
                    document.getElementById("adminEmail").value = data.user.email || "";
                }
            } catch (err) {
                console.error("Failed to load profile data", err);
            }

        const passwordComplexityRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#]).{8,}$/;
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const currentPasswordInputField = document.getElementById("adminCurrentPassword");
        const currentPasswordHint = document.getElementById("currentPasswordHint");
        const newPasswordInput = document.getElementById("adminPassword");
        const togglePasswordBtn = document.getElementById("togglePassword");
        const confirmPasswordWrapper = document.getElementById("confirmPasswordWrapper");
        const confirmPasswordInput = document.getElementById("adminConfirmPassword");

        let currentPasswordVerified = false;
        let verifyDebounceTimer = null;

        function lockNewPasswordField() {
            currentPasswordVerified = false;
            newPasswordInput.disabled = true;
            newPasswordInput.value = "";
            newPasswordInput.placeholder = "Verify current password first";
            newPasswordInput.classList.add("bg-slate-100", "text-slate-400", "cursor-not-allowed");
            togglePasswordBtn.disabled = true;
            togglePasswordBtn.classList.add("text-slate-300", "cursor-not-allowed");
            confirmPasswordWrapper.classList.add("hidden");
            confirmPasswordInput.value = "";
        }

        function unlockNewPasswordField() {
            currentPasswordVerified = true;
            newPasswordInput.disabled = false;
            newPasswordInput.placeholder = "••••••••";
            newPasswordInput.classList.remove("bg-slate-100", "text-slate-400", "cursor-not-allowed");
            togglePasswordBtn.disabled = false;
            togglePasswordBtn.classList.remove("text-slate-300", "cursor-not-allowed");
        }

        async function verifyCurrentPassword() {
            const value = currentPasswordInputField.value;

            if (!value) {
                lockNewPasswordField();
                currentPasswordHint.textContent = "Required to save any change to this profile.";
                currentPasswordHint.className = "text-[11px] text-slate-400 mt-1";
                return;
            }

            try {
                const res = await fetch('/admin/profile/verify-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentPassword: value })
                });
                const result = await res.json();

                if (result.success && result.valid) {
                    unlockNewPasswordField();
                    currentPasswordHint.textContent = "Verified — you may now set a new password.";
                    currentPasswordHint.className = "text-[11px] text-emerald-600 mt-1";
                } else {
                    lockNewPasswordField();
                    currentPasswordHint.textContent = "Incorrect password.";
                    currentPasswordHint.className = "text-[11px] text-rose-500 mt-1";
                }
            } catch (err) {
                console.error("Password verification failed:", err);
                lockNewPasswordField();
                currentPasswordHint.textContent = "Unable to verify right now. Please try again.";
                currentPasswordHint.className = "text-[11px] text-rose-500 mt-1";
            }
        }

        // Debounce so we're not firing a request on every single keystroke
        currentPasswordInputField.addEventListener("input", () => {
            clearTimeout(verifyDebounceTimer);
            verifyDebounceTimer = setTimeout(verifyCurrentPassword, 500);
        });

        // Show the confirm-password field only once the admin starts typing a new password
        newPasswordInput.addEventListener("input", () => {
            confirmPasswordWrapper.classList.toggle("hidden", newPasswordInput.value.trim() === "");
        });

        // Handle Form Submit
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("adminEmail").value.trim();
            const currentPassword = document.getElementById("adminCurrentPassword").value;
            const password = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            function showError(message) {
                alertBox.classList.remove("hidden");
                alertBox.className = "mb-4 p-3 rounded-xl text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200";
                alertBox.textContent = message;
            }

            if (!currentPassword) {
                showError("Please enter your current password to confirm this change.");
                return;
            }

            if (!emailPattern.test(email)) {
                showError("Please enter a valid email address.");
                return;
            }

            if (password) {
                if (!currentPasswordVerified) {
                    showError("Please enter your correct current password before setting a new one.");
                    return;
                }
                if (!passwordComplexityRegex.test(password)) {
                    showError("New password must be at least 8 characters, with uppercase, lowercase, a number, and a special character.");
                    return;
                }
                if (password === currentPassword) {
                    showError("New password cannot be the same as your current password.");
                    return;
                }
                if (password !== confirmPassword) {
                    showError("New password and confirmation do not match.");
                    return;
                }
            }

            try {
                const res = await fetch('/admin/profile/update', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, currentPassword, password })
                });
                const result = await res.json();

                alertBox.classList.remove("hidden");
                if (result.success) {
                    alertBox.className = "mb-4 p-3 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200";
                    alertBox.textContent = "Profile updated successfully!";
                    document.getElementById("adminCurrentPassword").value = "";
                    confirmPasswordInput.value = "";
                    confirmPasswordWrapper.classList.add("hidden");
                    lockNewPasswordField();
                    currentPasswordHint.textContent = "Required to save any change to this profile.";
                    currentPasswordHint.className = "text-[11px] text-slate-400 mt-1";
                } else {
                    alertBox.className = "mb-4 p-3 rounded-xl text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200";
                    alertBox.textContent = result.message || "Failed to update profile.";
                }

                setTimeout(() => {
                    alertBox.classList.add("hidden");
                }, 4000);

            } catch (err) {
                console.error(err);
            }
        });
        });

        // Password Toggle Logic (New Password)
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("adminPassword");
        const eyeIcon = document.getElementById("eyeIcon");

        togglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            eyeIcon.className = isPassword ? "fa-solid fa-eye-slash text-sm" : "fa-solid fa-eye text-sm";
        });

        // Password Toggle Logic (Current Password)
        const toggleCurrentPassword = document.getElementById("toggleCurrentPassword");
        const currentPasswordInput = document.getElementById("adminCurrentPassword");
        const eyeIconCurrent = document.getElementById("eyeIconCurrent");

        toggleCurrentPassword.addEventListener("click", () => {
            const isPassword = currentPasswordInput.type === "password";
            currentPasswordInput.type = isPassword ? "text" : "password";
            eyeIconCurrent.className = isPassword ? "fa-solid fa-eye-slash text-sm" : "fa-solid fa-eye text-sm";
        });
    </script>
</body>
</html>
