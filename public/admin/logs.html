<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/images/Pawpon_logo.png">
    <title>PAWPON ADMIN – Activity Logs </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/adminSidebar.js"></script>
    <script src="../assets/js/adminTopbar.js"></script>
</head>
<body class="h-full font-sans text-slate-800 antialiased flex overflow-hidden bg-slate-50">

    <div id="sidebar" class="flex-shrink-0"></div>

    <main class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-white">
        <div id="topbar" class="flex-shrink-0 border-b border-slate-200"></div>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-4xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="p-6 border-b border-slate-100">
                    <h2 class="text-lg font-bold text-slate-900">Activity Logs</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Most recent 200 admin actions across the platform.</p>
                </div>
                <div id="logsList" class="divide-y divide-slate-100">
                    <p class="p-6 text-xs text-slate-400">Loading...</p>
                </div>
                <div id="logsPagination" class="hidden flex items-center justify-between px-6 py-4 border-t border-slate-100">
                    <p id="logsPaginationText" class="text-xs text-slate-500"></p>
                    <div id="logsPaginationButtons" class="flex items-center gap-1"></div>
                </div>
            </div>
        </div>
    </main>
    <script src="../assets/js/adminLogs.js"></script>
</body>
</html>
