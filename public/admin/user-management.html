<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawpon | User Management</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/user-management.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/adminSidebar.js"></script>
    <script src="../assets/js/adminTopbar.js"></script>
    <script src="../assets/js/adminUserManagement.js"></script>
</head>

<body class="h-full text-slate-800 antialiased font-sans flex overflow-hidden bg-slate-50">

    <!-- Sidebar Container -->
    <div id="sidebar" class="flex-shrink-0"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-white">

        <!-- Topbar Container -->
        <div id="topbar" class="flex-shrink-0 border-b border-slate-200"></div>

        <!-- Scrollable Body Content -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6 hide-scrollbar">

            <!-- Title / Search Bar / Stats Bar -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 fade-in">
                <!-- Search Input Box -->
                <div class="relative flex-1 max-w-md">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input
                        type="text"
                        id="searchInput"
                        class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-700 placeholder-slate-400 focus:outline-none focus:border-brand-600 focus:ring-4 focus:ring-brand-500/10 transition-all shadow-sm"
                        placeholder="Search users by name, email, or role..."
                        autocomplete="off"
                    />
                </div>

                <!-- Total Count Badge -->
                <div class="inline-flex items-center gap-2 self-start sm:self-auto px-3.5 py-2 bg-white border border-slate-200 rounded-xl shadow-sm text-xs font-semibold text-slate-600">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span id="userCount">0 Users</span>
                </div>
            </div>
            
            <!-- User Cards Grid -->
            <div
                id="userRowsContainer"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 fade-in">
                <!-- JS dynamically injects updated cards here -->
            </div>
        </div>
    </main>

    <!-- Detail Panel Slide-over Overlay -->
    <div id="panelOverlay" class="panel-overlay fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity"></div>

    <!-- Detail Panel Drawer -->
    <aside id="detailPanel" class="detail-panel fixed top-0 right-0 w-full max-w-md h-full bg-white shadow-2xl z-50 transform translate-x-full flex flex-col border-l border-slate-200">
        <!-- Drawer Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-slate-50/50">
            <h3 class="font-bold text-slate-800 text-base flex items-center gap-2.5">
                <i class="fa-regular fa-id-card text-brand-600"></i> User Details
            </h3>
            <button id="panelClose" class="w-8 h-8 rounded-lg bg-slate-200/60 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition">
                <i class="fas fa-xmark"></i>
            </button>
        </div>

        <!-- Drawer Content Body -->
        <div id="panelBody" class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Dynamic Content loaded via JS -->
        </div>
    </aside>

    <!-- Custom Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-[70] flex flex-col gap-2 pointer-events-none"></div>

    <!-- 🟢 DITO NA NAKALIPAT SA LABAS (ISANG HILERA NA SA PINAKABABANG <body>) -->
    <div id="customConfirmModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm mx-4 transform transition-all scale-95 opacity-0 duration-200" id="modalContentBox">
            <div class="flex items-center gap-3 mb-4">
                <div id="modalIconContainer" class="w-10 h-10 rounded-full flex items-center justify-center bg-amber-100 text-amber-600">
                    <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                </div>
                <div>
                    <h3 id="modalTitle" class="font-bold text-slate-800 text-base">Confirm Action</h3>
                    <p id="modalDesc" class="text-xs text-slate-500">Are you sure you want to proceed?</p>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button id="modalCancelBtn" class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                    Cancel
                </button>
                <button id="modalConfirmBtn" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-sm">
                    Confirm
                </button>
            </div>
        </div>
    </div>

</body>
</html>
