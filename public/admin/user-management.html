<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/images/Pawpon_logo.png">
    <title>PAWPON ADMIN – User Management</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/inter.css">
    <!-- Local Font Awesome -->
    <link rel="stylesheet" href="/css/fontawesome/all.min.css">
    <link rel="stylesheet" href="../assets/css/user-management.css" />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind.css">
    <script src="../assets/js/adminSidebar.js"></script>
    <script src="../assets/js/adminTopbar.js"></script>
    <script src="../assets/js/adminUserManagement.js"></script>
</head>

<body class="h-full text-slate-800 antialiased font-sans flex overflow-hidden bg-slate-50">

    <!-- Sidebar Container -->
    <div id="sidebar" class="flex-shrink-0"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-white">

        <!-- Topbar Container -->
        <div id="topbar" class="flex-shrink-0 border-b border-slate-200"></div>

        <!-- Scrollable Body Content -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6 hide-scrollbar">

            <!-- Title / Search Bar / Stats Bar -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 fade-in">
                <!-- Search Input Box -->
                <div class="relative flex-1 max-w-md">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input
                        type="text"
                        id="searchInput"
                        class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-700 placeholder-slate-400 focus:outline-none focus:border-brand-600 focus:ring-4 focus:ring-brand-500/10 transition-all shadow-sm"
                        placeholder="Search users by name, email, or role..."
                        autocomplete="off"
                    />
                </div>

                <!-- Role Filter Dropdown -->
                <div class="relative">
                    <select
                        id="roleFilter"
                        class="appearance-none pl-4 pr-9 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:border-brand-600 focus:ring-4 focus:ring-brand-500/10 transition-all shadow-sm cursor-pointer">
                        <option value="all">All Roles</option>
                        <option value="adopter">Adopter</option>
                        <option value="organization">Organization</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                </div>

                <!-- Total Count Badge -->
                <div class="inline-flex items-center gap-2 self-start sm:self-auto px-3.5 py-2 bg-white border border-slate-200 rounded-xl shadow-sm text-xs font-semibold text-slate-600">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span id="userCount">0 Users</span>
                </div>
            </div>

            <!-- User Cards Grid -->
            <div
                id="userRowsContainer"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 fade-in">
                <!-- JS dynamically injects updated cards here -->
            </div>
        </div>
    </main>

    <!-- Detail Panel Overlay (single instance) -->
    <div id="panelOverlay"
         class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <!-- Detail Panel Drawer -->
    <aside id="detailPanel"
           class="fixed top-0 right-0 w-full max-w-md h-full bg-white shadow-2xl z-50 translate-x-full transition-transform duration-300 ease-in-out flex flex-col border-l border-slate-200">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200 bg-slate-50/70">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2.5">
                <span class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                    <i class="fa-regular fa-id-card text-xs"></i>
                </span>
                User Details
            </h3>
            <button id="panelClose"
                    class="w-8 h-8 rounded-lg bg-slate-200/70 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition">
                <i class="fas fa-xmark text-sm"></i>
            </button>
        </div>

        <!-- Body -->
        <div id="panelBody" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
    </aside>

    <!-- Custom Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-[70] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Custom Confirm Modal -->
    <div id="customConfirmModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm mx-4 transform transition-all scale-95 opacity-0 duration-200" id="modalContentBox">
            <div class="flex items-center gap-3 mb-4">
                <div id="modalIconContainer" class="w-10 h-10 rounded-full flex items-center justify-center bg-amber-100 text-amber-600">
                    <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                </div>
                <div>
                    <h3 id="modalTitle" class="font-bold text-slate-800 text-base">Confirm Action</h3>
                    <p id="modalDesc" class="text-xs text-slate-500">Are you sure you want to proceed?</p>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button id="modalCancelBtn" class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                    Cancel
                </button>
                <button id="modalConfirmBtn" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-sm">
                    Confirm
                </button>
            </div>
        </div>
    </div>
</body>
</html>
