<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/Pawpon_logo.png">
    <title>PAWPON – Forgot Password </title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-100 font-sans p-5">

<div class="w-full max-w-[430px] bg-white border border-slate-200 rounded-[20px] p-8 md:p-[35px] shadow-[0_10px_30px_rgba(15,23,42,0.08)]">

    <div class="w-[60px] h-[60px] mx-auto mb-5 rounded-2xl bg-blue-50 text-[#1656ff] flex items-center justify-center text-2xl">
        <i class="fa-solid fa-key"></i>
    </div>

    <h1 class="text-center text-slate-900 text-2xl font-bold">
        Forgot Password?
    </h1>

    <p class="text-center text-slate-500 text-sm leading-relaxed mt-2.5 mb-6">
        Enter the email address associated with your Pawpon account.
        We'll send you a secure link to create a new password.
    </p>

    <form id="forgotPasswordForm">

        <label for="email" class="block text-slate-700 text-sm font-semibold mb-2">
            Email Address
        </label>

        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
            class="w-full px-3.5 py-3 border border-slate-300 rounded-lg text-sm outline-none transition focus:border-[#1656ff] focus:ring-4 focus:ring-[#1656ff]/10"
        >

        <button 
            type="submit" 
            class="w-full mt-4.5 py-3 px-4 rounded-lg bg-[#1656ff] hover:bg-[#0d3dcc] text-white text-sm font-bold transition flex items-center justify-center gap-2 cursor-pointer border-0"
        >
            <i class="fa-solid fa-paper-plane"></i>
            Send Reset Link
        </button>

    </form>

    <div id="message" class="hidden mt-4 px-3.5 py-3 rounded-lg text-[13px] leading-relaxed"></div>

    <a href="/auth/login.html" class="flex items-center justify-center gap-2 text-center mt-5 text-[#1656ff] text-[13px] font-semibold no-underline hover:underline">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Login
    </a>

</div>

<script src="/assets/js/forgotPassword.js"></script>

</body>
</html>
