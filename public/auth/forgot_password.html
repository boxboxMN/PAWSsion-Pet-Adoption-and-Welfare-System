<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/Pawpon_logo.png">
    <title>PAWPON – Forgot Password</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind.css">

    <!-- Local Font Awesome -->
    <link rel="stylesheet" href="/css/fontawesome/all.min.css">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/inter.css">

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-5 bg-slate-50">

    <!-- Card -->
    <div class="w-full max-w-[420px] bg-white rounded-2xl border border-slate-200 shadow-[0_4px_6px_-1px_rgba(15,23,42,0.04),0_20px_40px_-12px_rgba(15,23,42,0.08)] p-8 sm:p-10">

        <!-- Icon -->
        <div class="flex justify-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-blue-50 flex items-center justify-center">
                <i class="fa-solid fa-key text-[22px] text-[#1656ff]"></i>
            </div>
        </div>

        <!-- Title -->
        <h1 class="text-center text-[24px] font-bold text-slate-900 mb-2">
            Forgot Password?
        </h1>

        <!-- Subtitle -->
        <p class="text-center text-[14px] leading-relaxed text-slate-500 mb-8">
            Enter the email address associated with your Pawpon account. We'll send you a secure link to reset your password.
        </p>

        <!-- Form -->
        <form id="forgotPasswordForm" novalidate class="space-y-5">

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-[13px] font-semibold text-slate-700 mb-2">
                    Email Address
                </label>

                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[15px] pointer-events-none"></i>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                        class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-xl text-[14px] text-slate-900 bg-white outline-none transition-all duration-200 placeholder:text-slate-400 focus:border-[#1656ff] focus:ring-4 focus:ring-[#1656ff]/10"
                    >
                </div>
            </div>

            <!-- Submit Button -->
            <button
                id="submitBtn"
                type="submit"
                class="w-full py-3 px-5 rounded-xl bg-[#1656ff] text-white text-[14px] font-semibold cursor-pointer flex items-center justify-center gap-2 transition-all duration-200 hover:bg-[#0d3dcc] active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed disabled:active:scale-100"
            >
                <i class="fa-solid fa-paper-plane text-[13px]"></i>
                <span>Send Reset Link</span>
            </button>

        </form>

        <!-- Message -->
        <div id="message" class="hidden mt-5 px-4 py-3 rounded-xl text-[13px] leading-snug items-start gap-2.5"></div>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-7">
            <div class="flex-1 h-px bg-slate-200"></div>
            <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">or</span>
            <div class="flex-1 h-px bg-slate-200"></div>
        </div>

        <!-- Back to Login -->
        <a href="/auth/login"
           class="flex items-center justify-center gap-2 text-[#1656ff] text-[13px] font-semibold no-underline transition-colors hover:text-[#0d3dcc] group">
            <i class="fa-solid fa-arrow-left text-[11px] transition-transform duration-200 group-hover:-translate-x-1"></i>
            <span>Back to Login</span>
        </a>

    </div>

    <script src="/assets/js/forgotPassword.js"></script>

</body>
</html>
